name: Keep Pulse Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: |
          echo "Pinging https://pulse-178f.onrender.com/api/health ..."
          curl -fsS --max-time 60 https://pulse-178f.onrender.com/api/health
          echo ""
