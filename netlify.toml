"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "public"
  command = "echo 'Pulse frontend served via Netlify CDN -> Render backend'"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/*"
  to = "https://pulse-178f.onrender.com/:splat"
  status = 200
  force = true
