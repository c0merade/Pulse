services:
  pulse:
    build: .
    container_name: picsart-academy-pulse
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/pulse.db}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - pulse_data:/app/data
    restart: unless-stopped

volumes:
  pulse_data:
